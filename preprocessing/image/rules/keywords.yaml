# 텍스트 블록 1차 분류 규칙
# - 공백을 모두 지운 텍스트에 대해 비교하므로 키워드도 공백 없이 적는다.
# - 우선순위: risk_notice > return_claim > other > headline(글자 크기) > unknown
# - 어떤 규칙에도 걸리지 않으면 unknown (이후 LLM이 분류)

risk_notice:
  keywords:
    # 원금 손실
    - 원금손실
    - 원금의손실
    - 투자원금의손실
    - 원금일부손실
    - 원금의일부또는전부
    - 원금이보장되지
    - 원금보장되지
    - 원금을보장하지
    - 원금비보장
    - 손실이발생
    - 손실은투자자
    - 투자자에게귀속
    - 손실위험
    - 손실가능성
    - 투자위험
    - 위험등급
    # 예금자보호
    - 예금자보호
    - 예금보험공사
    - 보호하지않습니다
    - 보호되지않
    - 보호대상이아닙
    - 보호한도
    # 과거 실적
    - 과거수익률
    - 과거의수익률
    - 과거운용실적
    - 과거의운용실적
    - 과거의실적
    - 미래의수익을보장
    - 미래수익을보장
    - 미래의운용성과
    - 수익을보장하지
    # 설명 의무·약관
    - 투자설명서
    - 상품설명서
    - 약관을반드시
    - 약관을읽어
    - 설명을받으시
    - 설명을받을권리
    - 충분한설명
    - 금융소비자보호법
    - 유의사항
    # 비용·세금·변동
    - 수수료가발생
    - 수수료가부과
    - 별도부과
    - 별도발생
    - 보수가발생
    - 운용보수
    - 판매보수
    - 펀드보수
    - 총보수
    - 환율변동
    - 환손실
    - 자산가격변동
    - 가격변동위험
    - 신용등급하락
    - 세법개정
    - 세법변경
    - 과세기준
    - 변동될수있
    - 변경될수있
    - 달라질수있
    - 중도해지
    - 기타소득세
  patterns: []

return_claim:
  keywords:
    - 수익률
    - 금리
    - 이율
    - 이자율
    - 확정수익
    - 연수익
    - 고수익
    - 수익보장
  patterns:
    - '연[0-9]+(\.[0-9]+)?%'
    - '최고[0-9]+(\.[0-9]+)?%'
    - '[0-9]+(\.[0-9]+)?%(수익|금리|이율|이자)'

other:
  keywords:
    - 심의필
    - 준법감시인
    - 금융투자협회
    - 은행연합회
    - 광고물유효기간
    - 고객센터
    - 고객상담
    - 바로가기
    - www.
    - http
    - .com
    - .co.kr
  patterns:
    - '1[0-9]{3}-[0-9]{4}'                 # 대표번호 1588-0000
    - '0[0-9]{1,2}-[0-9]{3,4}-[0-9]{4}'    # 일반 전화번호
    - '제[0-9]{2,4}-[0-9]+호'              # 심의필 번호
  # 텍스트가 사실상 브랜드명뿐일 때만 other (브랜드명 + 3글자 이내)
  brands:
    - KB국민은행
    - 국민은행
    - KB금융그룹
    - KB금융
    - KB증권
    - 하나은행
    - 하나금융그룹
    - 하나증권
    - 우리은행
    - 우리금융그룹
    - 우리금융
    - 신한은행
    - 신한금융그룹
    - 신한투자증권
    - NH농협은행
    - 농협은행
    - NH투자증권
    - IBK기업은행
    - 기업은행
    - 카카오뱅크
    - 토스뱅크
    - 케이뱅크
    - 미래에셋증권
    - 삼성증권
    - 한국투자증권
    - 키움증권
